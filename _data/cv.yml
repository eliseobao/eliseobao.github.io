  sections:
    Research Interests:
      - bullet: "**NLP for Mental Health** — detecting and explaining depression-related symptoms in social media using clinical frameworks such as the DSM-5 and BDI-II."
      - bullet: "**Explainable AI** — developing interpretable methods and clinically grounded explanations for mental-health assessment."
      - bullet: "**Conversational AI** — building conversational agents that support clinicians in reviewing and assessing mental-health information."
      - bullet: "**Persona Simulation and Evaluation** — evaluating how faithfully LLM-based personas simulate real users for mental-health research."
      - bullet: "**Multilingual NLP** — adapting language models to underrepresented languages, including Galician."

