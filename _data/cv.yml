    # NOTE on redundant fields below (publisher/summary/url on Publications, title/awarder
    # on Awards): al_folio_cv's website templates (cv/publications.liquid, cv/awards.liquid)
    # were written against JSONResume-style field names and never fully reconciled with
    # RenderCV's actual schema (PublicationEntry has `title`+`authors`+`journal`+`doi`, not
    # `publisher`/`summary`/`url`; NormalEntry has `name`, not `title`/`awarder`). RenderCV's
    # own entry models tolerate extra keys, so these are added purely so the *website* CV
    # page (not the PDF, which reads the real fields directly) shows authors/venue/links and
    # award names correctly. See al_folio_cv issue tracker before removing if this gets fixed
    # upstream.
    Publications:
      - title: "Eval4Sim: An Evaluation Framework for Persona Simulation"
        authors:
          - "**Eliseo Bao**"
          - Anxo Pérez
          - Javier Parapar
          - Xi Wang
        journal: "Proc. of the 35th ACM Int'l Conference on Information and Knowledge Management (CIKM 2026), Rome, Italy. Forthcoming"
        doi: 10.1145/3799682.3840172
        date: 2026-11
        publisher: "Proc. of the 35th ACM Int'l Conference on Information and Knowledge Management (CIKM 2026), Rome, Italy. Forthcoming"
        summary: "Introduces a three-dimensional framework (adherence, consistency, naturalness) for evaluating how well LLM personas simulate human conversation."
        url: https://doi.org/10.1145/3799682.3840172

      - title: Improving clinical reliability of LLM reasoning for depression assessment via structured generation and GRPO
        authors:
          - "**Eliseo Bao**"
          - Anxo Pérez
          - Javier Parapar
        journal: Science Progress, 109(3)
        doi: 10.1177/00368504261467483
        date: 2026-07
        publisher: Science Progress, 109(3)
        summary: "Shows GRPO-trained LLMs can explain depression-screening decisions through DSM-5-aligned reasoning without sacrificing classification accuracy."
        url: https://doi.org/10.1177/00368504261467483

      - title: Learning Evidence of Depression Symptoms via Prompt Induction
        authors:
          - "**Eliseo Bao**"
          - Anxo Pérez
          - David Otero
          - Javier Parapar
        journal: "Proc. of the 49th International ACM SIGIR Conference (SIGIR 2026), Melbourne, Australia"
        doi: 10.1145/3805712.3809873
        date: 2026-07
        publisher: "Proc. of the 49th International ACM SIGIR Conference (SIGIR 2026), Melbourne, Australia"
        summary: "Proposes Symptom Induction, compressing labeled examples into interpretable guidelines that improve LLM classification of depressive symptoms."
        url: https://doi.org/10.1145/3805712.3809873

      - title: How does depression talk on social media? Modeling depression language with relevance-based statistical language models
        authors:
          - "**Eliseo Bao**"
          - Anxo Pérez
          - David Otero
          - Javier Parapar
        journal: "Online Social Networks and Media, 50, 100339"
        doi: 10.1016/j.osnem.2025.100339
        date: 2025-12
        publisher: "Online Social Networks and Media, 50, 100339"
        summary: "Builds relevance-based statistical language models of depression-related language to rank users by risk across Reddit and Twitter."
        url: https://doi.org/10.1016/j.osnem.2025.100339

      - title: "ReDSM5: A Reddit Dataset for DSM-5 Depression Detection"
        authors:
